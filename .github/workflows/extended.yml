name: Extended tests

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  recovered-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip -e ".[test]"

      - name: Run complete recovered suite
        run: xvfb-run -a python -m pytest -q
