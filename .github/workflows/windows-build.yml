name: Windows standalone build

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install project, desktop, test, and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,desktop,build]"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Build and verify Windows release candidates
        shell: pwsh
        run: .\packaging\windows\build.ps1 -Python python

      - name: Verify stable artifact names
        shell: pwsh
        run: |
          $required = @(
            "artifacts/Calculator-of-Knots-and-Links-Windows-x64-Setup.exe",
            "artifacts/Calculator-of-Knots-and-Links-Windows-x64-Portable.zip",
            "artifacts/SHA256SUMS.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing artifact: $path" }
          }

      - name: Upload Windows release candidates
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-of-Knots-and-Links-Windows-x64
          path: |
            artifacts/Calculator-of-Knots-and-Links-Windows-x64-Setup.exe
            artifacts/Calculator-of-Knots-and-Links-Windows-x64-Portable.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
