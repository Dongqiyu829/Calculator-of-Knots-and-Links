name: Tagged Windows release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag to validate for a non-publishing dry run, e.g. v0.1.2"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install project, desktop, test, and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,desktop,build]"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Validate release tag against application version
        shell: pwsh
        run: |
          python -m src.version --check-tag "$env:RELEASE_TAG"
          $version = python -c "from src.version import __version__; print(__version__)"
          "RELEASE_VERSION=$($version.Trim())" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build and verify release candidates
        shell: pwsh
        run: .\packaging\windows\build.ps1 -Python python

      - name: Verify stable release assets
        shell: pwsh
        run: |
          $required = @(
            "artifacts/Calculator-of-Knots-and-Links-Windows-x64-Setup.exe",
            "artifacts/Calculator-of-Knots-and-Links-Windows-x64-Portable.zip",
            "artifacts/SHA256SUMS.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing artifact: $path" }
          }
          $checksumNames = Get-Content -LiteralPath "artifacts/SHA256SUMS.txt"
          foreach ($name in @("Calculator-of-Knots-and-Links-Windows-x64-Setup.exe", "Calculator-of-Knots-and-Links-Windows-x64-Portable.zip")) {
            if (-not ($checksumNames -match [regex]::Escape($name))) { throw "Checksum file does not cover $name" }
          }

      - name: Upload non-publishing dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Calculator-of-Knots-and-Links-${{ env.RELEASE_VERSION }}-release-dry-run
          path: |
            artifacts/Calculator-of-Knots-and-Links-Windows-x64-Setup.exe
            artifacts/Calculator-of-Knots-and-Links-Windows-x64-Portable.zip
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "artifacts/Calculator-of-Knots-and-Links-Windows-x64-Setup.exe" `
            "artifacts/Calculator-of-Knots-and-Links-Windows-x64-Portable.zip" `
            "artifacts/SHA256SUMS.txt" `
            --title "Calculator of Knots and Links $env:RELEASE_VERSION" --generate-notes
