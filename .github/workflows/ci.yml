name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install baseline test dependencies
        run: python -m pip install --upgrade pip pytest

      - name: Run recovery and regression tests
        run: python -m pytest -q

      - name: Compile recovered Python source
        run: python -m compileall -q src examples
