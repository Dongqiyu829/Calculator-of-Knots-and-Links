name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  fast-core:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project and test dependencies
        run: python -m pip install --upgrade pip -e ".[test,desktop]"

      - name: Run fast core regression tests
        run: python -m pytest -q -m "not slow and not gui"

      - name: Compile recovered Python source
        run: python -m compileall -q src examples
