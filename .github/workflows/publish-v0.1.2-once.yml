name: Publish v0.1.2 one-shot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/publish-v0.1.2-once.yml"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      RELEASE_TAG: v0.1.2
      RELEASE_VERSION: 0.1.2
      RELEASE_SHA: 5fa74ec9d96d8e3b8b446a74e268ae67eed97f8a
    steps:
      - name: Checkout reviewed release commit
        uses: actions/checkout@v5
        with:
          ref: 5fa74ec9d96d8e3b8b446a74e268ae67eed97f8a
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          architecture: x64

      - name: Install project, desktop, test, and build dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,desktop,build]"

      - name: Install Inno Setup 6
        shell: pwsh
        run: choco install innosetup --no-progress -y

      - name: Strict release preflight
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $head = (git rev-parse HEAD).Trim()
          if ($head -ne $env:RELEASE_SHA) { throw "Checked out $head, expected $env:RELEASE_SHA" }
          python -m src.version --check-tag "$env:RELEASE_TAG"
          $version = (python -c "from src.version import __version__; print(__version__)").Trim()
          if ($version -ne $env:RELEASE_VERSION) { throw "Version $version != $env:RELEASE_VERSION" }
          $remoteTag = git ls-remote --tags origin "refs/tags/$env:RELEASE_TAG"
          if ($remoteTag) { throw "Tag $env:RELEASE_TAG already exists; refusing to move or replace it." }
          $latest = gh release view --json tagName --jq ".tagName"
          if ($LASTEXITCODE -ne 0 -or $latest.Trim() -ne "v0.1.1") {
            throw "Expected latest release v0.1.1 before publication; got '$latest'."
          }

      - name: Build and verify release candidates
        shell: pwsh
        run: .\packaging\windows\build.ps1 -Python python

      - name: Verify stable release assets
        shell: pwsh
        run: |
          $required = @(
            "artifacts/Calculator-of-Knots-and-Links-Windows-x64-Setup.exe",
            "artifacts/Calculator-of-Knots-and-Links-Windows-x64-Portable.zip",
            "artifacts/SHA256SUMS.txt"
          )
          foreach ($path in $required) {
            if (-not (Test-Path -LiteralPath $path)) { throw "Missing artifact: $path" }
          }
          $checksumNames = Get-Content -LiteralPath "artifacts/SHA256SUMS.txt"
          foreach ($name in @("Calculator-of-Knots-and-Links-Windows-x64-Setup.exe", "Calculator-of-Knots-and-Links-Windows-x64-Portable.zip")) {
            if (-not ($checksumNames -match [regex]::Escape($name))) { throw "Checksum file does not cover $name" }
          }

      - name: Create immutable annotated tag
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$env:RELEASE_TAG" "$env:RELEASE_SHA" -m "Calculator of Knots and Links v0.1.2"
          git push origin "refs/tags/$env:RELEASE_TAG"

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$env:RELEASE_TAG" `
            "artifacts/Calculator-of-Knots-and-Links-Windows-x64-Setup.exe" `
            "artifacts/Calculator-of-Knots-and-Links-Windows-x64-Portable.zip" `
            "artifacts/SHA256SUMS.txt" `
            --title "Calculator of Knots and Links $env:RELEASE_VERSION" `
            --notes-file "docs/RELEASE_NOTES_0.1.2.md"

      - name: Verify published release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view "$env:RELEASE_TAG" --json tagName,name,isDraft,isPrerelease,assets,targetCommitish | ConvertFrom-Json
          if ($release.tagName -ne $env:RELEASE_TAG) { throw "Wrong release tag" }
          if ($release.name -ne "Calculator of Knots and Links $env:RELEASE_VERSION") { throw "Wrong release title" }
          if ($release.isDraft -or $release.isPrerelease) { throw "Release unexpectedly draft/prerelease" }
          $names = @($release.assets | ForEach-Object { $_.name })
          foreach ($name in @(
            "Calculator-of-Knots-and-Links-Windows-x64-Setup.exe",
            "Calculator-of-Knots-and-Links-Windows-x64-Portable.zip",
            "SHA256SUMS.txt"
          )) {
            if ($names -notcontains $name) { throw "Published release missing $name" }
          }
